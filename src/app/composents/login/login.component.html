<div class=" flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full">
      <h2 class="text-2xl font-bold text-center text-gray-800">Connexion</h2>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" formControlName="email"
            class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
  
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <input type="password" id="password" formControlName="password"
            class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
  
        <button class="w-full px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">
          Se connecter
        </button>
      </form>
    </div>
  </div>
