<div class="flex flex-col gap-8 p-8 h-full bg-gradient-to-br from-primary to-secondary">
  <!-- En-tête avec recherche, filtre et bouton Ajouter -->
  <div class="flex w-full justify-between items-center gap-4 bg-white/10 p-4 rounded-xl backdrop-blur-sm">
    <p class="text-green text-3xl font-bold">Menu Items</p>

    <!-- Champ de recherche -->
    <div class="border border-green/40 rounded-full px-4 py-2 w-1/4 bg-white/10 backdrop-blur-sm">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="filterProducts()"
        class="bg-transparent border-none focus-within:outline-none w-full text-white placeholder-white/70"
        placeholder="Search menu items..."
      />
    </div>

    <!-- Boutons de filtre -->
    <select
      [(ngModel)]="selectedFilter"
      (change)="filterProducts()"
      class="block px-4 py-2 text-white bg-purple/80 border-none rounded-full shadow-md focus:outline-none focus:ring-2 focus:ring-green/50 cursor-pointer"
    >
      <option value="all">All Categories</option>
      <option *ngFor="let category of categories" [value]="category">
        {{ category }}
      </option>
    </select>

    <!-- Bouton Ajouter -->
    <button
      class="flex bg-green px-4 py-2 rounded-full gap-2 text-lg text-primary font-bold items-center hover:bg-green/90 transition-colors duration-200 shadow-md"
      (click)="closeForm(true)"
      *ngIf="authService.isAdmin()"
    >
      <span class="text-xl">+</span>
      <span>Add Dish</span>
    </button>
  </div>

  <!-- Grille des produits -->
  <div class="bg-white/10 w-full rounded-xl text-white h-[90%] overflow-auto backdrop-blur-sm border border-white/20">
    <div class="overflow-y-auto w-full h-full p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let product of paginatedProducts" 
             class="group bg-white/5 rounded-xl overflow-hidden transition-all duration-300 hover:bg-white/15 hover:shadow-lg hover:shadow-green/20 border border-white/10 hover:border-green/30 flex flex-col">
          
          <!-- Image du produit -->
          <div class="w-full h-32 overflow-hidden relative">
            <img *ngIf="product?.image" [src]="product.image" [alt]="product.nom" 
                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
            <img *ngIf="!product?.image" src="assets/images/default-dish.png" 
                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" [alt]="product.nom">
            
            <!-- Badge de statut -->
            <span class="absolute top-2 right-2 px-2 py-1 rounded-full text-xs font-medium inline-block"
                  [ngClass]="{
                    'bg-green/80 text-primary': product.statut === 'DISPONIBLE',
                    'bg-red/80 text-white': product.statut !== 'DISPONIBLE'
                  }">
              {{ product.statut === 'DISPONIBLE' ? 'Available' : 'Sold Out' }}
            </span>
            
            <!-- Badge de catégorie -->
            <span class="absolute bottom-2 left-2 px-2 py-1 rounded-full text-xs font-medium bg-purple/60 text-white">
              {{ product.categorie }}
            </span>
          </div>
          
          <!-- Détails du produit -->
          <div class="p-4 flex flex-col flex-grow">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg group-hover:text-green transition-colors duration-300">{{ product.nom }}</h3>
              <p class="font-bold text-green text-lg">{{ product.prix }} FCFA</p>
            </div>
            
            <p class="text-white/80 mb-3 line-clamp-2 text-sm">{{ product.description }}</p>
            
            <div class="flex justify-between items-center mt-auto">
              <span class="text-white/70 text-sm">Quantite: {{ product.quantite }}</span>
              
              <!-- Actions : Modifier et Supprimer -->
              <div class="flex gap-2">
                <!-- Bouton Modifier -->
                <button (click)="editProduct(product)"
                 *ngIf="authService.isAdmin()"

                        class="text-white bg-blue-500 hover:bg-blue-700 p-2 rounded-full transition duration-200">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5z"/>
                  </svg>
                </button>

                <!-- Bouton Supprimer -->
                <button (click)="deleteProduct(product.id); $event.stopPropagation()"
                         *ngIf="authService.isAdmin()"

                        class="text-white bg-red hover:bg-red-700 p-2 rounded-full transition duration-200">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                    <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Contrôles de pagination -->
    <div class="flex justify-end items-center gap-2 p-4 bg-secondary/80 text-white backdrop-blur-sm">
      <!-- Première page -->
      <button 
        *ngIf="currentPage > 3"
        class="px-4 py-2 text-lg font-bold rounded border border-white/30 hover:bg-white/10 transition-colors duration-200"
        (click)="changePage(1)"
      >
        1
      </button>

      <!-- Points de suspension au début -->
      <span *ngIf="currentPage > 3" class="text-white/70">...</span>

      <!-- Pages autour de la page courante -->
      <button 
        *ngFor="let page of getVisiblePages()"
        class="px-4 py-2 text-lg font-bold rounded transition-colors duration-200"
        [ngClass]="{
          'bg-green text-primary border-green': currentPage === page,
          'text-white border border-white/30 hover:bg-white/10': currentPage !== page
        }"
        (click)="changePage(page)"
      >
        {{ page }}
      </button>

      <!-- Points de suspension à la fin -->
      <span *ngIf="currentPage < totalPages - 2" class="text-white/70">...</span>

      <!-- Dernière page -->
      <button 
        *ngIf="currentPage < totalPages - 2"
        class="px-4 py-2 text-lg font-bold rounded border border-white/30 hover:bg-white/10 transition-colors duration-200"
        (click)="changePage(totalPages)"
      >
        {{ totalPages }}
      </button>
    </div>
  </div>

  <!-- Formulaire de produit -->
  <app-product-form
    *ngIf="showProductForm()"
    [productToEdit]="selectedProduct"
    (closed)="closeForm(!$event)"
    (productCreated)="handleProductCreated($event)"
    (productUpdated)="handleProductUpdated($event)"
  ></app-product-form>
</div>
